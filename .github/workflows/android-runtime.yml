name: Android offline runtime smoke test
on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'android/**'
      - 'tools/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-runtime.yml'
  workflow_dispatch:
    inputs:
      network_probe:
        description: 'Probe API 35 networking for 180 seconds without building or inference'
        required: false
        type: boolean
        default: false
      lifecycle_stress:
        description: 'Test-only bounded native IME/lifecycle regression on genuine API35 x86_64 16KB; no release'
        required: false
        type: boolean
        default: false
      lifecycle_comparison:
        description: 'One bounded detailed original-app versus separate native WebView control on the same genuine 16KB image'
        required: false
        type: boolean
        default: false
      image_comparison:
        description: 'Once-built identical APKs on official API35 r05 / API36 r07 full 16KB images; test only'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: android-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    if: ${{ !inputs.image_comparison }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_AVD_HOME: /tmp/shikuang-avd
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.lifecycle_stress || inputs.lifecycle_comparison) && '[{"api":35,"id":"35-16k","tag":"google_apis_ps16k","pageSize":16384}]' || inputs.network_probe && '[{"api":35,"id":"35","tag":"google_apis","pageSize":4096}]' || '[{"api":24,"id":"24","tag":"google_apis","pageSize":4096},{"api":30,"id":"30","tag":"google_apis","pageSize":4096},{"api":35,"id":"35","tag":"google_apis","pageSize":4096},{"api":35,"id":"35-16k","tag":"google_apis_ps16k","pageSize":16384}]') }}
    steps:
      - name: Validate isolated test scope
        run: |
          SHIKUANG_DIAGNOSTIC_COUNT=0
          for SHIKUANG_DIAGNOSTIC_FLAG in "${{ inputs.lifecycle_stress }}" "${{ inputs.lifecycle_comparison }}" "${{ inputs.network_probe }}" "${{ inputs.image_comparison }}"; do
            if [[ "$SHIKUANG_DIAGNOSTIC_FLAG" = true ]]; then SHIKUANG_DIAGNOSTIC_COUNT=$((SHIKUANG_DIAGNOSTIC_COUNT + 1)); fi
          done
          test "$SHIKUANG_DIAGNOSTIC_COUNT" -le 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ !inputs.network_probe }}
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
        if: ${{ !inputs.network_probe }}
      - run: npm run sync
        if: ${{ !inputs.network_probe }}
      - name: Build independent control application and instrumentation before emulator experiment
        if: ${{ inputs.lifecycle_comparison }}
        run: ./android/gradlew -p android16k-control --no-daemon --max-workers=2 assembleDebug assembleDebugAndroidTest
      - name: Install official Android emulator image
        shell: bash
        run: |
          SHIKUANG_ANDROID_SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SHIKUANG_ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "emulator" \
            "system-images;android-${{ matrix.api }};${{ matrix.tag }};x86_64"
          printf '%s\n' "$SHIKUANG_ANDROID_SDK/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$SHIKUANG_ANDROID_SDK/cmdline-tools/latest/bin/avdmanager" create avd \
            --name "shikuang-api${{ matrix.id }}" \
            --package "system-images;android-${{ matrix.api }};${{ matrix.tag }};x86_64" \
            --device pixel_2 --path "$ANDROID_AVD_HOME/shikuang-api${{ matrix.id }}.avd" --force
          test -f "$ANDROID_AVD_HOME/shikuang-api${{ matrix.id }}.ini"
          "$SHIKUANG_ANDROID_SDK/emulator/emulator" -list-avds
          sudo chmod 666 /dev/kvm
      - name: Boot emulator and disconnect device networking
        shell: bash
        run: |
          mkdir -p runtime-artifacts
          SHIKUANG_ANDROID_SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          nohup "$SHIKUANG_ANDROID_SDK/emulator/emulator" \
            -avd "shikuang-api${{ matrix.id }}" -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            -camera-back none -camera-front none -memory 3072 -cores 2 -accel on \
            > runtime-artifacts/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          timeout 180 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do sleep 2; done'
          # Check the actual kernel/libc page size. No property override simulates this gate.
          if (( ${{ matrix.api }} < 26 )); then
            # Android 7 has no getconf binary. Read an actual mapped kernel page;
            # the instrumented Java Os.sysconf check independently confirms it.
            adb shell cat /proc/self/smaps > runtime-artifacts/device-page-mappings.txt
            awk '/^KernelPageSize:/ {print $2 * 1024; found=1; exit} END {if (!found) exit 1}' runtime-artifacts/device-page-mappings.txt > runtime-artifacts/device-page-size.txt
          else
            adb shell getconf PAGE_SIZE > runtime-artifacts/device-page-size.txt
          fi
          test "$(tr -d '\r\n' < runtime-artifacts/device-page-size.txt)" = "${{ matrix.pageSize }}"
          printf '%s\n' "system-images;android-${{ matrix.api }};${{ matrix.tag }};x86_64" > runtime-artifacts/system-image.txt
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          # Starting adbd as root may close the first transport while Android
          # finishes booting. Retry only this finite connection transition;
          # root UID and every genuine offline/page-size gate remain required.
          SHIKUANG_ROOT_READY=false
          for SHIKUANG_ROOT_ATTEMPT in 1 2 3 4 5; do
            printf 'attempt=%s\n' "$SHIKUANG_ROOT_ATTEMPT" >> runtime-artifacts/adb-root-transition.txt
            timeout 20 adb root >> runtime-artifacts/adb-root-transition.txt 2>&1 || true
            timeout 30 adb wait-for-device >> runtime-artifacts/adb-root-transition.txt 2>&1 || true
            SHIKUANG_ROOT_UID="$(timeout 10 adb shell id -u 2>> runtime-artifacts/adb-root-transition.txt | tr -d '\r' || true)"
            printf 'uid=%s\n' "$SHIKUANG_ROOT_UID" >> runtime-artifacts/adb-root-transition.txt
            if [[ "$SHIKUANG_ROOT_UID" = 0 ]]; then SHIKUANG_ROOT_READY=true; break; fi
            sleep 2
          done
          test "$SHIKUANG_ROOT_READY" = true
          # The Google API image carries MOBILE[LTE] on eth0. Wait for SIM setup
          # before disabling its radio, so first-boot telephony cannot restore it.
          if (( ${{ matrix.api }} < 29 )); then
            timeout 90 bash -c 'until [[ "$(adb shell getprop gsm.sim.state)" =~ (LOADED|READY) ]]; do sleep 2; done'
            sleep 10
          else
            timeout 90 bash -c 'until [[ "$(adb shell getprop gsm.sim.state)" == *LOADED* ]]; do sleep 2; done'
          fi
          adb shell getprop gsm.sim.state > runtime-artifacts/sim-state.txt
          adb shell cmd connectivity help > runtime-artifacts/connectivity-shell-help.txt 2>&1 || true
          # Official ConnectivityService shell API writes the persistent mode and broadcasts it.
          # https://android.googlesource.com/platform/packages/modules/Connectivity/+/refs/heads/android15-release/service/src/com/android/server/ConnectivityService.java
          if (( ${{ matrix.api }} < 29 )); then
            # Android 7's official Settings uses this same setting + protected broadcast.
            # https://android.googlesource.com/platform/packages/apps/Settings/+/android-7.0.0_r1/src/com/android/settings/AirplaneModeEnabler.java
            adb shell settings put global airplane_mode_on 1
            adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true
            test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = 1
          else
            adb shell cmd connectivity airplane-mode enable
            test "$(adb shell cmd connectivity airplane-mode | tr -d '\r')" = enabled
          fi
          adb shell svc wifi disable
          adb shell svc data disable
          adb shell 'for device in eth0 eth1 wlan0; do if ip link show "$device" >/dev/null 2>&1; then ip link set "$device" down; fi; done'
          test "$(timeout 20 adb get-state | tr -d '\r')" = device
          timeout 60 bash -c 'until [[ "$(adb shell dumpsys connectivity)" == *"Active default network: none"* ]]; do sleep 2; done'
          adb shell ip route show > runtime-artifacts/ipv4-routes.txt
          adb shell ip -6 route show > runtime-artifacts/ipv6-routes.txt
          adb shell ip route show table all > runtime-artifacts/ipv4-all-route-tables.txt
          adb shell ip -6 route show table all > runtime-artifacts/ipv6-all-route-tables.txt
          adb shell dumpsys ethernet > runtime-artifacts/ethernet.txt 2>&1 || true
          adb shell dumpsys connectivity > runtime-artifacts/connectivity.txt
          adb shell service check ethernet > runtime-artifacts/ethernet-service-availability.txt 2>&1 || true
          adb shell settings get global airplane_mode_on > runtime-artifacts/airplane-mode.txt
          adb shell dumpsys telephony.registry > runtime-artifacts/telephony.txt
          adb shell getprop ro.product.cpu.abi > runtime-artifacts/device-abi.txt
          adb shell getprop ro.product.cpu.abilist > runtime-artifacts/device-supported-abis.txt
          adb shell dumpsys webviewupdate > runtime-artifacts/webview-provider.txt
          adb shell settings get global wifi_on > runtime-artifacts/wifi-state.txt
          adb shell settings get global mobile_data > runtime-artifacts/mobile-data-state.txt
          adb logcat -c
          nohup adb logcat -v threadtime > runtime-artifacts/logcat.txt 2>&1 &
      - name: Probe disconnected networking throughout the original build interval
        if: ${{ inputs.network_probe }}
        shell: bash
        run: |
          mkdir -p runtime-artifacts/network-probe
          timeout 210 bash <<'SHIKUANG_PROBE'
          set -euo pipefail
          SHIKUANG_PROBE_START=$(date +%s)
          SHIKUANG_PROBE_SAMPLE=0
          while true; do
            SHIKUANG_PROBE_ELAPSED=$(( $(date +%s) - SHIKUANG_PROBE_START ))
            timeout 15 adb shell dumpsys connectivity > "runtime-artifacts/network-probe/connectivity-$SHIKUANG_PROBE_SAMPLE.txt"
            grep -q 'Active default network: none' "runtime-artifacts/network-probe/connectivity-$SHIKUANG_PROBE_SAMPLE.txt"
            timeout 15 adb shell ip route show table all > "runtime-artifacts/network-probe/ipv4-$SHIKUANG_PROBE_SAMPLE.txt"
            timeout 15 adb shell ip -6 route show table all > "runtime-artifacts/network-probe/ipv6-$SHIKUANG_PROBE_SAMPLE.txt"
            if grep -Eq '^default .*dev (eth[0-9]|wlan[0-9]|rmnet[^ ]*)' "runtime-artifacts/network-probe/ipv4-$SHIKUANG_PROBE_SAMPLE.txt" "runtime-artifacts/network-probe/ipv6-$SHIKUANG_PROBE_SAMPLE.txt"; then
              echo 'An external default route returned during the network probe.'
              exit 1
            fi
            test "$(timeout 15 adb shell cmd connectivity airplane-mode | tr -d '\r')" = enabled
            printf 'elapsed=%s seconds; active default network=none; external route=none; airplane mode=enabled\n' "$SHIKUANG_PROBE_ELAPSED" >> runtime-artifacts/network-probe-summary.txt
            if (( SHIKUANG_PROBE_ELAPSED >= 180 )); then break; fi
            SHIKUANG_PROBE_SAMPLE=$(( SHIKUANG_PROBE_SAMPLE + 1 ))
            sleep 5
          done
          test "$(timeout 15 adb get-state | tr -d '\r')" = device
          SHIKUANG_PROBE
      - name: Run packaged WebView with actual native ONNX inference
        if: ${{ !inputs.network_probe && !inputs.lifecycle_stress && !inputs.lifecycle_comparison }}
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.expectedPageSize=${{ matrix.pageSize }} -Pandroid.testInstrumentationRunnerArguments.notClass=com.shikuang.app.InputLifecycle16kStressInstrumentedTest connectedDebugAndroidTest
      - name: Allow and record visible soft keyboard for isolated input stress
        if: ${{ (inputs.lifecycle_stress || inputs.lifecycle_comparison) && !inputs.network_probe }}
        shell: bash
        run: |
          adb shell settings get secure show_ime_with_hard_keyboard > runtime-artifacts/ime-with-hard-keyboard-before.txt
          adb shell settings put secure show_ime_with_hard_keyboard 1
          adb shell settings get secure show_ime_with_hard_keyboard > runtime-artifacts/ime-with-hard-keyboard-after.txt
          test "$(tr -d '\r\n' < runtime-artifacts/ime-with-hard-keyboard-after.txt)" = 1
          adb shell settings get secure default_input_method > runtime-artifacts/default-input-method-before-stress.txt
          adb shell dumpsys input_method > runtime-artifacts/input-method-before-stress.txt
          adb shell dumpsys window > runtime-artifacts/window-before-stress.txt
      - name: Run independent native WebView control once
        if: ${{ inputs.lifecycle_comparison }}
        id: control16k
        continue-on-error: true
        run: ./android/gradlew -p android16k-control --no-daemon --max-workers=2 -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.class=com.shikuang.control16k.WebViewControl16kInstrumentedTest connectedDebugAndroidTest
      - name: Preserve control experiment before original app
        if: ${{ always() && inputs.lifecycle_comparison }}
        run: |
          mkdir -p runtime-artifacts/control16k
          timeout 30 adb logcat -b all -d -v threadtime > runtime-artifacts/control16k/logcat-after-control.txt || true
          timeout 20 adb shell dumpsys activity exit-info com.shikuang.control16k > runtime-artifacts/control16k/exit-info.txt || true
          timeout 20 adb exec-out screencap -p > runtime-artifacts/control16k/final-screen.png || true
          timeout 20 adb shell dumpsys input_method > runtime-artifacts/control16k/input-method.txt || true
          timeout 20 adb shell dumpsys window > runtime-artifacts/control16k/window.txt || true
          timeout 20 adb shell dumpsys webviewupdate > runtime-artifacts/control16k/webview-provider.txt || true
          timeout 20 adb shell pm path com.shikuang.control16k > runtime-artifacts/control16k/package-path.txt || true
      - name: Run detailed original application protocol once
        if: ${{ always() && inputs.lifecycle_comparison && steps.control16k.outcome != 'skipped' }}
        id: app16k
        continue-on-error: true
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.class=com.shikuang.app.InputLifecycle16kStressInstrumentedTest connectedDebugAndroidTest
      - name: Run bounded genuine 16KB input and lifecycle stress
        if: ${{ inputs.lifecycle_stress && !inputs.network_probe }}
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.expectedPageSize=16384 '-Pandroid.testInstrumentationRunnerArguments.class=com.shikuang.app.MineralEngineInstrumentedTest#legacyNativeAssetMigrationPreservesSpecimens,com.shikuang.app.InputLifecycle16kStressInstrumentedTest' connectedDebugAndroidTest
      - name: Capture runtime diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p runtime-artifacts
          ps -ef > runtime-artifacts/host-processes-final.txt
          free -m > runtime-artifacts/host-memory-final.txt
          timeout 15 adb reconnect offline > runtime-artifacts/adb-reconnect-final.txt 2>&1 || true
          timeout 20 adb wait-for-device >> runtime-artifacts/adb-reconnect-final.txt 2>&1 || true
          timeout 20 adb exec-out screencap -p > runtime-artifacts/final-screen.png || true
          timeout 20 adb shell dumpsys webviewupdate > runtime-artifacts/webview-provider-final.txt || true
          timeout 20 adb shell dumpsys ethernet > runtime-artifacts/ethernet-final.txt || true
          timeout 20 adb shell dumpsys connectivity > runtime-artifacts/connectivity-final.txt || true
          timeout 20 adb shell ip route show table all > runtime-artifacts/ipv4-all-route-tables-final.txt || true
          timeout 20 adb shell ip -6 route show table all > runtime-artifacts/ipv6-all-route-tables-final.txt || true
          # A live streaming adb log may disconnect when the test driver resets
          # its connection. Preserve final buffers and process exit reasons too.
          timeout 30 adb logcat -b all -d -v threadtime > runtime-artifacts/logcat-final.txt || true
          timeout 20 adb shell dumpsys activity exit-info com.shikuang.app.preview > runtime-artifacts/app-exit-info.txt 2>&1 || true
          timeout 20 adb shell ps -A > runtime-artifacts/processes-final.txt 2>&1 || true
          timeout 20 adb shell dmesg > runtime-artifacts/kernel-final.txt 2>&1 || true
          timeout 20 adb shell getprop ro.build.fingerprint > runtime-artifacts/device-build-fingerprint.txt 2>&1 || true
          timeout 20 adb shell settings get secure default_input_method > runtime-artifacts/default-input-method.txt 2>&1 || true
          timeout 20 adb shell dumpsys input_method > runtime-artifacts/input-method-final.txt 2>&1 || true
          timeout 20 adb shell dumpsys window > runtime-artifacts/window-final.txt 2>&1 || true
          timeout 20 adb shell settings get secure show_ime_with_hard_keyboard > runtime-artifacts/ime-with-hard-keyboard-final.txt 2>&1 || true
          timeout 20 adb shell pm list packages --apex-only --show-versioncode > runtime-artifacts/apex-versions.txt 2>&1 || true
          mkdir -p runtime-artifacts/tombstones
          timeout 30 adb pull /data/tombstones/. runtime-artifacts/tombstones/ > runtime-artifacts/tombstone-collection.txt 2>&1 || true
          mkdir -p runtime-artifacts/runtime-smoke
          timeout 60 adb pull /sdcard/googletest/test_outputfiles/. runtime-artifacts/runtime-smoke/ || true
          # The official AndroidX test storage provider owns this directory.
          # AGP's UTP collector copies genuine files before
          # later Gradle tasks finish. Preserve that export if post-test ADB drops.
          python3 - <<'PYOUTPUT'
          from pathlib import Path
          import hashlib, shutil
          sources = [Path('android/app/build/outputs/connected_android_test_additional_output'), Path('android16k-control/build/outputs/connected_android_test_additional_output')]
          target = Path('runtime-artifacts/runtime-smoke')
          for source in sources:
              for file in source.rglob('*') if source.exists() else []:
                  if not file.is_file() or file.suffix not in ('.json', '.png', '.txt'):
                      continue
                  target.mkdir(parents=True, exist_ok=True)
                  output = target / file.name
                  if output.exists():
                      assert output.read_bytes() == file.read_bytes(), f'Device and UTP evidence differ: {file.name}'
                  else:
                      shutil.copy2(file, output)
          PYOUTPUT
      - name: Require screenshots and JSON from successful runtime tests
        if: ${{ success() && !inputs.network_probe && !inputs.lifecycle_stress && !inputs.lifecycle_comparison }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          folder = Path('runtime-artifacts/runtime-smoke')
          report = json.loads((folder / 'runtime-report.json').read_text())
          manifest = json.loads(Path('web/model-manifest.json').read_text())
          reference = json.loads(Path('web/data/reference-manifest.json').read_text())
          images = json.loads(Path('web/data/image-sources.json').read_text())
          native = json.loads((folder / 'native-contract-runtime.json').read_text())
          photo_manifest_bytes = Path('web/data/reviewed-photo-assets.json').read_bytes()
          photo_manifest = json.loads(photo_manifest_bytes)
          photo = json.loads((folder / 'reviewed-photo-runtime.json').read_text())
          assert photo['phase'] == 'passed' and photo['sdk'] == ${{ matrix.api }} and photo['pageSize'] == ${{ matrix.pageSize }}
          assert photo['packageName'] == 'com.shikuang.app.preview' and photo['versionCode'] == 25001 and photo['versionName'] == '2.5.0-preview.1'
          assert photo['activeNetworkBefore'] is None and photo['activeNetworkAfter'] is None
          assert photo['photoManifestSha256'] == hashlib.sha256(photo_manifest_bytes).hexdigest()
          assert photo['photosDecoded'] == reference['counts']['local_reviewed_photos'] == len(photo_manifest['assets'])
          assert photo['sourceRecords'] == reference['counts']['source_image_records'] == len(images['records'])
          assert len(photo['photos']) == photo['photosDecoded']
          expected_photos = {row['path']: (row['sha256'], row['bytes']) for row in photo_manifest['assets']}
          assert {row['path']: (row['sha256'], row['bytes']) for row in photo['photos']} == expected_photos
          assert all(row['actualNativeDecode'] is True and min(row['width'], row['height']) >= 224 and max(row['width'], row['height']) <= 512 for row in photo['photos'])
          print(f"Verified {photo['photosDecoded']} exact packaged JPEGs with the genuine Android decoder while disconnected; no mineral-label or accuracy claim.")
          assert native['phase'] == 'passed' and native['runtimeVersion'] == '1.24.3'
          assert native['sdk'] == ${{ matrix.api }} and native['pageSize'] == ${{ matrix.pageSize }}
          assert {row['id']: row['sha256'] for row in native['graphs']} == {row['id']: row['sha256'] for row in manifest['models']}
          assert all(row['finiteOutput'] for row in native['graphs'])
          if report['phase'] == 'unsupported-webview-recovery-passed':
              assert ${{ matrix.api }} == 24 and report['photoRecognitionVerified'] is False
              assert report['boot']['supported'] is False and report['boot']['missing']
              assert report['network']['native']['activeNetwork'] is None and report['network']['native']['connected'] is False
              assert '本机标本和历史记录会保留' in report['recovery']
              content = (folder / 'legacy-webview-recovery.png').read_bytes()
              assert content.startswith(b'\x89PNG\r\n\x1a\n') and len(content) > 1024
              print('API24 factory WebView recovery UI and actual Java ONNX graph compatibility verified; photo UI recognition not claimed.')
              raise SystemExit(0)
          migration = json.loads((folder / 'asset-migration-report.json').read_text())
          assert migration['phase'] == 'migration-passed' and migration['historyPreserved'] is True
          assert migration['controller'] is False and migration['registrationCount'] == 0 and migration['poisonedPage'] is False
          assert migration['cacheSeeded'] is True
          if migration['registration_supported']:
              assert migration['controllerSeeded'] is True
          else:
              assert migration['controllerSeeded'] is False and migration['registration_error']
              print('Native service-worker registration unavailable: verified real CacheStorage and IndexedDB migration; no controlled-page migration claim.')
          for filename in ['quartz-result.png', 'dog-rejection.png', 'library-offline-overview.png', 'quartz-reference-details.png', 'quartz-image-references.png', 'abellaite-reference-details.png']:
              content = (folder / filename).read_bytes()
              assert content.startswith(b'\x89PNG\r\n\x1a\n') and len(content) > 1024, filename
          assert report['phase'] == 'passed', report.get('phase')
          assert report['quartz']['engine'] == 'onnx-native-android'
          assert report['network']['native']['pageSize'] == ${{ matrix.pageSize }}
          assert report['network']['native']['versionCode'] == 25001
          assert report['network']['native']['versionName'] == '2.5.0-preview.1'
          assert report['network']['native']['packageName'] == 'com.shikuang.app.preview'
          assert int(Path('runtime-artifacts/device-page-size.txt').read_text().strip()) == ${{ matrix.pageSize }}
          assert report['quartz']['modelCount'] == len(manifest['modes']['ensemble'])
          assert report['quartz']['modelVersion'] == manifest['version']
          assert report['fast']['modelCount'] == 1
          assert report['fast']['engine'] == 'onnx-native-android'
          assert report['fast']['diagnostics']['residentSessionCount'] <= 2
          assert report['fast']['manifestSha256'] == report['quartz']['manifestSha256']
          assert report['catalog']['imaSpecies'] == reference['counts']['ima_species']
          assert report['catalog']['crystalSpecies'] == reference['counts']['species_with_records']
          assert report['catalog']['imageReferences'] == len(images['records'])
          assert report['catalog']['localFetches'] == 1 + len(reference['files'])
          assert report['catalog']['online'] is False
          assert report['initialReferenceRequests'] == [] and report['visibleVersion'] == '2.5'
          quartz_sources = [row for row in images['records'] if row['mineral_name'] == 'Quartz' and row.get('local_image_url')]
          assert 0 < len(report['galleryPhotos']) == len(report['galleryReopened']) == min(5, len(quartz_sources))
          assert report['galleryRevokedCount'] == len(report['galleryPhotos'])
          for index, row in enumerate(report['galleryPhotos']):
              reopened = report['galleryReopened'][index]
              assert row['decoded'] is True and row['complete'] is True and reopened['decoded'] is True
              assert (row['sha256'], row['bytes']) == expected_photos[row['path']]
              assert (reopened['sha256'], reopened['bytes']) == expected_photos[reopened['path']]
              assert row['width'] > 0 and row['height'] > 0
              assert reopened['blobUrl'] != row['blobUrl']
              assert '?image=' + row['sha256'] in row['url']
              assert row['sourceUrl'].startswith('https://') and row['licenseUrl'].startswith('https://')
          assert len(report['catalogPhotoFetches']) >= len(report['galleryPhotos'])
          assert all(row['local'] is True and row['status'] == 200 and '?image=' in row['url'] for row in report['catalogPhotoFetches'])
          for field in ('network', 'networkAfterCatalog'):
              assert report[field]['native']['activeNetwork'] is None
              assert report[field]['native']['connected'] is False
          assert report['photoGeometry']['exifOrientation'] == 6
          assert len(report['photoGeometry']['crops']) == 3
          assert len(report['screenshots']) == 6
          assert all(row['visualStateSynchronized'] for row in report['screenshots'])
          print('Preserved native inference, offline catalog JSON and six genuine app screenshots.')
          PY
      - name: Require observed 16KB stress evidence
        if: ${{ success() && inputs.lifecycle_stress && !inputs.network_probe }}
        shell: bash
        run: |
          python3 - <<'PYSTRESS'
          import json
          from pathlib import Path
          report=json.loads(Path('runtime-artifacts/runtime-smoke/input-lifecycle-report.json').read_text())
          migration=json.loads(Path('runtime-artifacts/runtime-smoke/asset-migration-report.json').read_text())
          assert report['phase']=='passed' and report['sdk']==35 and report['pageSize']==16384 and report['deviceAbi']=='x86_64'
          assert report['packageName']=='com.shikuang.app.preview' and report['versionCode']==25001
          assert report['activeNetworkBefore'] is None and report['activeNetworkAfter'] is None
          assert report['nativeInputCycles']==9 and report['fallbackNoEditCycles']==3
          assert len(report['cycles'])==12 and len({r['cycle'] for r in report['cycles']})==12
          assert all(r['backgroundForegroundVerified'] and r['recreateVerified'] and r['storedRecordPreserved'] and r['closedWithoutObservedCrash'] for r in report['cycles'])
          assert sum(r['nativeComposingAndVisibleImeVerified'] for r in report['cycles'])==9
          assert report['sentinelRemoved'] and report['productionAccuracyClaim'] is False
          assert migration['phase']=='migration-passed' and migration['historyPreserved'] and not migration['poisonedPage']
          folder = Path('runtime-artifacts/runtime-smoke')
          for view, selector, cycle in [('identify','#notes',1),('library','#librarySearch',2),('records','#recordSearch',3)]:
              stem = f'input-lifecycle-{view}-composing'
              evidence = json.loads((folder / (stem + '.json')).read_text())
              assert evidence['selector']==selector and evidence['imeVisible'] and evidence['windowFocus'] and evidence['nativeViewFocus']
              assert evidence['dom']['active'] and evidence['dom']['value']==f'quartz-实验室-{cycle}'
              assert (folder / (stem + '.png')).read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
              assert (folder / (stem + '-hard-keyboard-setting.txt')).read_text().strip()=='1'
          assert (folder / 'input-lifecycle-final.png').read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          print('Observed 12 bounded lifecycle cycles, 9 native composing/visible-IME cycles and 3 no-edit controls; not root-cause closure.')
          PYSTRESS
      - name: Require both complete actual 16KB comparison protocols
        if: ${{ always() && inputs.lifecycle_comparison }}
        env:
          SHIKUANG_CONTROL_OUTCOME: ${{ steps.control16k.outcome }}
          SHIKUANG_APP_OUTCOME: ${{ steps.app16k.outcome }}
        run: |
          python3 - <<'PYCOMPARE'
          import json, os
          from pathlib import Path
          folder=Path('runtime-artifacts/runtime-smoke')
          summary={'control_step':os.environ['SHIKUANG_CONTROL_OUTCOME'],'original_app_step':os.environ['SHIKUANG_APP_OUTCOME'],'protocols':{},'root_cause_fixed':False}
          for prefix, package in [('control16k-input-lifecycle','com.shikuang.control16k'),('input-lifecycle','com.shikuang.app.preview')]:
              filename=folder / (prefix+'-report.json')
              summary['protocols'][package]={'report_present':filename.exists()}
              if filename.exists():
                  report=json.loads(filename.read_text())
                  summary['protocols'][package].update(phase=report.get('phase'),completed_cycles=len(report.get('cycles',[])),native_cycles=sum(r.get('nativeComposingAndVisibleImeVerified',False) for r in report.get('cycles',[])))
          Path('runtime-artifacts/comparison-step-outcomes.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          assert summary['control_step']=='success' and summary['original_app_step']=='success',summary
          for prefix, package in [('control16k-input-lifecycle','com.shikuang.control16k'),('input-lifecycle','com.shikuang.app.preview')]:
              report=json.loads((folder / (prefix+'-report.json')).read_text())
              assert report['phase']=='passed' and report['sdk']==35 and report['pageSize']==16384 and report['deviceAbi']=='x86_64'
              assert report['packageName']==package and report['activeNetworkBefore'] is None and report['activeNetworkAfter'] is None
              assert len(report['cycles'])==12 and len({r['cycle'] for r in report['cycles']})==12
              assert sum(r['nativeComposingAndVisibleImeVerified'] for r in report['cycles'])==9
              for suffix in ['/native-touch-after','/ime-visible','/chinese-dom-verified']:
                  assert sum(event['action'].endswith(suffix) for event in report['events'])==27
              assert all(r['backgroundForegroundVerified'] and r['recreateVerified'] and r['storedRecordPreserved'] and r['closedWithoutObservedCrash'] for r in report['cycles'])
              assert report['sentinelRemoved'] and not report['productionAccuracyClaim']
              for cycle in range(12):
                  if cycle % 4 == 0: continue
                  for phase in ['compose-before-background','compose-before-recreate','compose-before-close']:
                      connection=json.loads((folder / f'{prefix}-connection-result-{cycle}-{phase}.json').read_text())
                      assert connection['nativeCompositionReturned'] and 'failure' not in connection
                      assert connection['actualCallThreadId']==connection['handlerThreadId'] and connection['actualCallThreadName']==connection['handlerThreadName']
              for view,selector,cycle in [('identify','#notes',1),('library','#librarySearch',2),('records','#recordSearch',3)]:
                  stem=f'{prefix}-{view}-composing'
                  evidence=json.loads((folder / (stem+'.json')).read_text())
                  assert evidence['selector']==selector and evidence['imeVisible'] and evidence['windowFocus'] and evidence['nativeViewFocus']
                  assert evidence['dom']['active'] and evidence['dom']['value']==f'quartz-实验室-{cycle}'
                  assert (folder / (stem+'.png')).read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
                  ime_stem=f'{prefix}-{view}-ime-visible'
                  ime=json.loads((folder / (ime_stem+'.json')).read_text())
                  assert ime['imeVisible'] and ime['windowFocus'] and ime['nativeViewFocus'] and ime['dom']['active']
                  assert (folder / (ime_stem+'.png')).read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          print('Both bounded protocols fully observed. Root cause remains open; no production fix or release claim.')
          PYCOMPARE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.lifecycle_comparison && 'shikuang-16kb-native-webview-comparison' || inputs.lifecycle_stress && 'shikuang-16kb-input-lifecycle-stress' || inputs.network_probe && 'shikuang-network-probe-api35' || format('shikuang-runtime-api-{0}', matrix.id) }}
          path: |
            runtime-artifacts/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/connected_android_test_additional_output/
            android16k-control/build/reports/androidTests/
            android16k-control/build/outputs/androidTest-results/
            android16k-control/build/outputs/connected_android_test_additional_output/
            android16k-control/build/intermediates/merged_manifests/
          if-no-files-found: warn

  frozen-image-apks:
    if: ${{ inputs.image_comparison }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      manifest_sha: ${{ steps.freeze.outputs.manifest_sha }}
    steps:
    - name: Require only the authorized image comparison mode
      run: |
        test "${{ inputs.image_comparison }}" = true
        for SHIKUANG_OTHER_FLAG in "${{ inputs.network_probe }}" "${{ inputs.lifecycle_stress }}" "${{ inputs.lifecycle_comparison }}"; do test "$SHIKUANG_OTHER_FLAG" != true; done
    - uses: actions/checkout@v4
    - name: Retrieve exact immutable APK artifact from retained setup-failure run
      uses: actions/download-artifact@v5
      with:
        name: shikuang-image-comparison-frozen-apks
        path: frozen-apks
        repository: ${{ github.repository }}
        run-id: 38104162907
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - id: freeze
      name: Verify byte-identical original four APKs and helper without rebuilding
      run: |
        git fetch --no-tags --depth=1 origin 1c345718018ae0ffe657cb5a853adfedcddd11eb
        python3 - <<'PYREUSE'
        from pathlib import Path
        import json,hashlib,os,subprocess
        folder=Path('frozen-apks');raw=(folder/'manifest.json').read_bytes()
        assert hashlib.sha256(raw).hexdigest()=='4e91883a61c8663248bb62463616bc216637a5b20373a1571b67461c1f52bd0b'
        m=json.loads(raw);assert m['sourceSha']=='1c345718018ae0ffe657cb5a853adfedcddd11eb'
        assert m['fourExperimentApks']==['app.apk','app-test.apk','control.apk','control-test.apk'] and len(m['apks'])==5
        for row in m['apks']:
            file=folder/row['name'];assert file.stat().st_size==row['bytes'] and hashlib.sha256(file.read_bytes()).hexdigest()==row['sha256']
        for row in m['sourceFiles']:
            file=folder/'source'/row['path']
            if not file.exists():
                assert row['path']=='.github/workflows/android-runtime.yml','Only original hidden workflow metadata may be restored'
                source=subprocess.check_output(['git','show',m['sourceSha']+':'+row['path']])
                assert len(source)==row['bytes'] and hashlib.sha256(source).hexdigest()==row['sha256']
                file.parent.mkdir(parents=True,exist_ok=True);file.write_bytes(source)
                (folder/'workflow-source-recovery.json').write_text(json.dumps({'sourceSha':m['sourceSha'],'manifestBoundEntry':row,'cause':'Original artifact upload excluded hidden .github directory; old commit bytes restored, APKs untouched'},indent=2)+'\n')
            assert file.stat().st_size==row['bytes'] and hashlib.sha256(file.read_bytes()).hexdigest()==row['sha256']
            if row['path'].endswith('.java'):assert Path(row['path']).read_bytes()==file.read_bytes(),'Frozen test Java must be unchanged'
        with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('manifest_sha='+hashlib.sha256(raw).hexdigest()+'\n')
        print('Reuse exact retained original APKs; no Gradle/npm build or signing occurs in this workflow')
        PYREUSE
    - uses: actions/upload-artifact@v4
      with:
        name: shikuang-image-comparison-frozen-apks
        path: frozen-apks/
        if-no-files-found: error
        include-hidden-files: true
  official-image-runtime:
    if: ${{ inputs.image_comparison }}
    needs: frozen-image-apks
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_AVD_HOME: /tmp/shikuang-image-comparison-avd
    strategy:
      fail-fast: false
      matrix:
        include:
        - api: 35
          id: 35-r05
          tag: google_apis_ps16k
          pageSize: 16384
          revision: 5
          archive: x86_64-ps16k-35_r05.zip
          bytes: 1696342085
          sha1: d709cf26b375abecfbbf5803afd20749ddfa2865
        - api: 36
          id: 36-r07
          tag: google_apis_ps16k
          pageSize: 16384
          revision: 7
          archive: x86_64-ps16k-36_r07.zip
          bytes: 1849428145
          sha1: dd783282e84bf475a02eba6777c79fc5695e1583
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - uses: actions/download-artifact@v5
      with:
        name: shikuang-image-comparison-frozen-apks
        path: frozen-apks
    - name: Repair confirmed Ubuntu emulator host dependency and expose diagnostics path
      run: |
        set -euo pipefail
        mkdir -p runtime-artifacts
        SHIKUANG_ANDROID_SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
        printf '%s\n' "$SHIKUANG_ANDROID_SDK/platform-tools" >> "$GITHUB_PATH"
        dpkg-query -W libpulse0 > runtime-artifacts/host-libpulse-before.txt 2>&1 || true
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libpulse0
        dpkg-query -W libpulse0 > runtime-artifacts/host-libpulse-after.txt
        apt-cache policy libpulse0 > runtime-artifacts/host-libpulse-policy.txt
    - name: Verify official archive and exact installed system image
      run: |-
        set -euo pipefail
        mkdir -p runtime-artifacts
        SHIKUANG_ANDROID_SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
        curl --fail --location --max-time 45 --silent --show-error https://dl.google.com/android/repository/sys-img/google_apis/sys-img2-4.xml --output runtime-artifacts/official-sdk-catalog.xml
        curl --fail --location --max-time 600 --silent --show-error "https://dl.google.com/android/repository/sys-img/google_apis/${{ matrix.archive }}" --output official-image.zip
        python3 - <<'PYIMAGE'
        from pathlib import Path
        import xml.etree.ElementTree as E,hashlib,json,os
        raw=Path('runtime-artifacts/official-sdk-catalog.xml').read_bytes();tree=E.fromstring(raw)
        def tag(e):return e.tag.split('}')[-1]
        pkg=next(p for p in tree.iter() if tag(p)=='remotePackage' and p.get('path')=='system-images;android-${{ matrix.api }};google_apis_ps16k;x86_64')
        assert next(e.text for e in pkg.iter() if tag(e)=='major')=='${{ matrix.revision }}'
        assert next(e.get('ref') for e in pkg if tag(e)=='channelRef')=='channel-0'
        assert next(e.text for e in pkg.iter() if tag(e)=='url')=='${{ matrix.archive }}'
        assert next(e.text for e in pkg.iter() if tag(e)=='checksum')=='${{ matrix.sha1 }}'
        size=int(next(e.text for e in pkg.iter() if tag(e)=='size'));assert size==int('${{ matrix.bytes }}')==Path('official-image.zip').stat().st_size
        s1=hashlib.sha1();s256=hashlib.sha256()
        with open('official-image.zip','rb') as f:
            for chunk in iter(lambda:f.read(1024*1024),b''):s1.update(chunk);s256.update(chunk)
        assert s1.hexdigest()=='${{ matrix.sha1 }}'
        Path('runtime-artifacts/official-image-verification.json').write_text(json.dumps({'catalog_sha256':hashlib.sha256(raw).hexdigest(),'package':pkg.get('path'),'revision':'${{ matrix.revision }}','url':'https://dl.google.com/android/repository/sys-img/google_apis/${{ matrix.archive }}','bytes':size,'sha1':s1.hexdigest(),'sha256':s256.hexdigest(),'scope':'Complete image condition; ART/framework/provider may all change'},indent=2)+'\n')
        PYIMAGE
        "$SHIKUANG_ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "system-images;android-${{ matrix.api }};google_apis_ps16k;x86_64"
        ldd "$SHIKUANG_ANDROID_SDK/emulator/qemu/linux-x86_64/qemu-system-x86_64" > runtime-artifacts/emulator-host-ldd.txt
        cat runtime-artifacts/emulator-host-ldd.txt
        ! grep -q 'not found' runtime-artifacts/emulator-host-ldd.txt
        "$SHIKUANG_ANDROID_SDK/emulator/emulator" -version > runtime-artifacts/emulator-version.txt 2>&1
        grep -q 16428233 runtime-artifacts/emulator-version.txt
        python3 - <<'PYINSTALLED'
        from pathlib import Path
        import os,zipfile,hashlib,json
        root=Path(os.environ.get('ANDROID_SDK_ROOT') or os.environ['ANDROID_HOME'])/'system-images/android-${{ matrix.api }}/google_apis_ps16k/x86_64'
        rows=[]
        with zipfile.ZipFile('official-image.zip') as z:
            for member in z.infolist():
                if member.is_dir():continue
                parts=Path(member.filename).parts;assert parts[0]=='x86_64' and '..' not in parts
                installed=root.joinpath(*parts[1:]);assert installed.is_file(),str(installed)
                a=hashlib.sha256();b=hashlib.sha256()
                with z.open(member) as f:
                    for chunk in iter(lambda:f.read(1024*1024),b''):a.update(chunk)
                with installed.open('rb') as f:
                    for chunk in iter(lambda:f.read(1024*1024),b''):b.update(chunk)
                assert a.digest()==b.digest(),member.filename
                rows.append({'file':member.filename,'bytes':member.file_size,'sha256':a.hexdigest()})
        Path('runtime-artifacts/installed-image-file-hashes.json').write_text(json.dumps(rows,indent=2)+'\n')
        Path('runtime-artifacts/installed-image-package.xml').write_bytes((root/'package.xml').read_bytes())
        PYINSTALLED
        rm official-image.zip
        printf '%s\n' "$SHIKUANG_ANDROID_SDK/platform-tools" >> "$GITHUB_PATH"
        mkdir -p "$ANDROID_AVD_HOME"
        printf 'no\n' | "$SHIKUANG_ANDROID_SDK/cmdline-tools/latest/bin/avdmanager" create avd --name "shikuang-api${{ matrix.id }}" --package "system-images;android-${{ matrix.api }};google_apis_ps16k;x86_64" --device pixel_2 --path "$ANDROID_AVD_HOME/shikuang-api${{ matrix.id }}.avd" --force
        sudo chmod 666 /dev/kvm
    - name: Boot emulator and disconnect device networking
      shell: bash
      run: |
        mkdir -p runtime-artifacts
        SHIKUANG_ANDROID_SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
        nohup "$SHIKUANG_ANDROID_SDK/emulator/emulator" \
          -avd "shikuang-api${{ matrix.id }}" -no-window -no-audio \
          -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
          -camera-back none -camera-front none -memory 3072 -cores 2 -accel on \
          > runtime-artifacts/emulator.log 2>&1 &
        timeout 180 adb wait-for-device
        timeout 180 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do sleep 2; done'
        # Check the actual kernel/libc page size. No property override simulates this gate.
        if (( ${{ matrix.api }} < 26 )); then
          # Android 7 has no getconf binary. Read an actual mapped kernel page;
          # the instrumented Java Os.sysconf check independently confirms it.
          adb shell cat /proc/self/smaps > runtime-artifacts/device-page-mappings.txt
          awk '/^KernelPageSize:/ {print $2 * 1024; found=1; exit} END {if (!found) exit 1}' runtime-artifacts/device-page-mappings.txt > runtime-artifacts/device-page-size.txt
        else
          adb shell getconf PAGE_SIZE > runtime-artifacts/device-page-size.txt
        fi
        test "$(tr -d '\r\n' < runtime-artifacts/device-page-size.txt)" = "${{ matrix.pageSize }}"
        printf '%s\n' "system-images;android-${{ matrix.api }};${{ matrix.tag }};x86_64" > runtime-artifacts/system-image.txt
        adb shell input keyevent 82
        adb shell settings put global window_animation_scale 0
        adb shell settings put global transition_animation_scale 0
        adb shell settings put global animator_duration_scale 0
        # Starting adbd as root may close the first transport while Android
        # finishes booting. Retry only this finite connection transition;
        # root UID and every genuine offline/page-size gate remain required.
        SHIKUANG_ROOT_READY=false
        for SHIKUANG_ROOT_ATTEMPT in 1 2 3 4 5; do
          printf 'attempt=%s\n' "$SHIKUANG_ROOT_ATTEMPT" >> runtime-artifacts/adb-root-transition.txt
          timeout 20 adb root >> runtime-artifacts/adb-root-transition.txt 2>&1 || true
          timeout 30 adb wait-for-device >> runtime-artifacts/adb-root-transition.txt 2>&1 || true
          SHIKUANG_ROOT_UID="$(timeout 10 adb shell id -u 2>> runtime-artifacts/adb-root-transition.txt | tr -d '\r' || true)"
          printf 'uid=%s\n' "$SHIKUANG_ROOT_UID" >> runtime-artifacts/adb-root-transition.txt
          if [[ "$SHIKUANG_ROOT_UID" = 0 ]]; then SHIKUANG_ROOT_READY=true; break; fi
          sleep 2
        done
        test "$SHIKUANG_ROOT_READY" = true
        # The Google API image carries MOBILE[LTE] on eth0. Wait for SIM setup
        # before disabling its radio, so first-boot telephony cannot restore it.
        if (( ${{ matrix.api }} < 29 )); then
          timeout 90 bash -c 'until [[ "$(adb shell getprop gsm.sim.state)" =~ (LOADED|READY) ]]; do sleep 2; done'
          sleep 10
        else
          timeout 90 bash -c 'until [[ "$(adb shell getprop gsm.sim.state)" == *LOADED* ]]; do sleep 2; done'
        fi
        adb shell getprop gsm.sim.state > runtime-artifacts/sim-state.txt
        adb shell cmd connectivity help > runtime-artifacts/connectivity-shell-help.txt 2>&1 || true
        # Official ConnectivityService shell API writes the persistent mode and broadcasts it.
        # https://android.googlesource.com/platform/packages/modules/Connectivity/+/refs/heads/android15-release/service/src/com/android/server/ConnectivityService.java
        if (( ${{ matrix.api }} < 29 )); then
          # Android 7's official Settings uses this same setting + protected broadcast.
          # https://android.googlesource.com/platform/packages/apps/Settings/+/android-7.0.0_r1/src/com/android/settings/AirplaneModeEnabler.java
          adb shell settings put global airplane_mode_on 1
          adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true
          test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = 1
        else
          adb shell cmd connectivity airplane-mode enable
          test "$(adb shell cmd connectivity airplane-mode | tr -d '\r')" = enabled
        fi
        adb shell svc wifi disable
        adb shell svc data disable
        adb shell 'for device in eth0 eth1 wlan0; do if ip link show "$device" >/dev/null 2>&1; then ip link set "$device" down; fi; done'
        test "$(timeout 20 adb get-state | tr -d '\r')" = device
        timeout 60 bash -c 'until [[ "$(adb shell dumpsys connectivity)" == *"Active default network: none"* ]]; do sleep 2; done'
        adb shell ip route show > runtime-artifacts/ipv4-routes.txt
        adb shell ip -6 route show > runtime-artifacts/ipv6-routes.txt
        adb shell ip route show table all > runtime-artifacts/ipv4-all-route-tables.txt
        adb shell ip -6 route show table all > runtime-artifacts/ipv6-all-route-tables.txt
        adb shell dumpsys ethernet > runtime-artifacts/ethernet.txt 2>&1 || true
        adb shell dumpsys connectivity > runtime-artifacts/connectivity.txt
        adb shell service check ethernet > runtime-artifacts/ethernet-service-availability.txt 2>&1 || true
        adb shell settings get global airplane_mode_on > runtime-artifacts/airplane-mode.txt
        adb shell dumpsys telephony.registry > runtime-artifacts/telephony.txt
        adb shell getprop ro.product.cpu.abi > runtime-artifacts/device-abi.txt
        adb shell getprop ro.product.cpu.abilist > runtime-artifacts/device-supported-abis.txt
        adb shell dumpsys webviewupdate > runtime-artifacts/webview-provider.txt
        adb shell settings get global wifi_on > runtime-artifacts/wifi-state.txt
        adb shell settings get global mobile_data > runtime-artifacts/mobile-data-state.txt
        adb logcat -c
        nohup adb logcat -v threadtime > runtime-artifacts/logcat.txt 2>&1 &
    - name: Verify and install byte-identical frozen APKs
      env:
        EXPECTED_MANIFEST_SHA: ${{ needs.frozen-image-apks.outputs.manifest_sha }}
      run: |-
        python3 - <<'PYAPKCHECK'
        from pathlib import Path
        import json,hashlib,os
        folder=Path('frozen-apks');raw=(folder/'manifest.json').read_bytes();assert hashlib.sha256(raw).hexdigest()==os.environ['EXPECTED_MANIFEST_SHA']
        m=json.loads(raw);assert m['sourceSha']=='1c345718018ae0ffe657cb5a853adfedcddd11eb';assert len(m['apks'])==5
        for row in m['apks']:
            p=folder/row['name'];assert p.stat().st_size==row['bytes'] and hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256']
        Path('runtime-artifacts/frozen-apk-manifest.json').write_bytes(raw)
        Path('runtime-artifacts/executed-test-workflow.yml').write_bytes(Path('.github/workflows/android-runtime.yml').read_bytes())
        Path('runtime-artifacts/reused-apk-protocol.json').write_text(json.dumps({'executedWorkflowSha':os.environ['GITHUB_SHA'],'frozenApkSourceSha':m['sourceSha'],'frozenApkRunId':38104162907,'scope':'Repair CI host libpulse dependency; same original APK bytes, not App fix'},indent=2)+'\n')
        PYAPKCHECK
        for SHIKUANG_APK in frozen-apks/test-services-1.4.2.apk frozen-apks/control.apk frozen-apks/control-test.apk frozen-apks/app.apk frozen-apks/app-test.apk; do timeout 90 adb install -r -g "$SHIKUANG_APK"; done
        adb shell appops set androidx.test.services MANAGE_EXTERNAL_STORAGE allow
        adb shell pm list instrumentation > runtime-artifacts/instrumentation-components.txt
        adb shell pm list packages --show-versioncode > runtime-artifacts/installed-package-versions.txt
    - name: Capture actual signed provider and ART binary hashes BuildIds and ELF layout
      run: |-
        mkdir -p system-binary-verification runtime-artifacts/system-binary-metadata
        adb shell dumpsys webviewupdate > runtime-artifacts/system-binary-metadata/webview-provider.txt
        adb shell pm list packages --apex-only --show-versioncode > runtime-artifacts/system-binary-metadata/apex-versions.txt
        adb shell pm list packages > runtime-artifacts/system-binary-metadata/package-list.txt
        python3 - <<'PYPROVIDER'
        from pathlib import Path
        import subprocess,json,hashlib,os,zipfile
        out=Path('runtime-artifacts/system-binary-metadata');temp=Path('system-binary-verification')
        sdk=Path(os.environ.get('ANDROID_SDK_ROOT') or os.environ['ANDROID_HOME'])
        signers=sorted(sdk.glob('build-tools/*/apksigner'));assert signers
        packages=[s.split(':',1)[1] for s in (out/'package-list.txt').read_text().splitlines() if any(v in s for v in ['com.google.android.webview','com.android.webview','com.google.android.trichromelibrary'])]
        rows=[]
        for package in packages:
            paths=subprocess.check_output(['adb','shell','pm','path',package],text=True).strip().splitlines()
            subprocess.run(['adb','shell','dumpsys','package',package],stdout=open(out/(package+'-package.txt'),'wb'),check=True)
            for i,path in enumerate(paths):
                remote=path.removeprefix('package:').strip();local=temp/(package+'-'+str(i)+'.apk')
                subprocess.run(['adb','pull',remote,str(local)],check=True,timeout=90)
                cert=subprocess.run([str(signers[-1]),'verify','--print-certs',str(local)],capture_output=True,text=True,check=True)
                (out/(local.stem+'-certificates.txt')).write_text(cert.stdout)
                row={'package':package,'remote':remote,'bytes':local.stat().st_size,'sha256':hashlib.sha256(local.read_bytes()).hexdigest(),'elfs':[]}
                with zipfile.ZipFile(local) as z:
                    for name in z.namelist():
                        if not name.startswith('lib/x86_64/') or not name.endswith('.so'):continue
                        data=z.read(name);elf=temp/(local.stem+'-'+Path(name).name);elf.write_bytes(data)
                        meta=subprocess.check_output(['readelf','-W','-l','-n',str(elf)],text=True)
                        target=out/(elf.name+'-readelf.txt');target.write_text(meta)
                        row['elfs'].append({'name':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'readelf':target.name})
                rows.append(row)
        art=temp/'libart.so';subprocess.run(['adb','pull','/apex/com.android.art/lib64/libart.so',str(art)],check=True,timeout=60)
        meta=subprocess.check_output(['readelf','-W','-l','-n',str(art)],text=True);(out/'libart-readelf.txt').write_text(meta)
        rows.append({'remote':'/apex/com.android.art/lib64/libart.so','bytes':art.stat().st_size,'sha256':hashlib.sha256(art.read_bytes()).hexdigest(),'readelf':'libart-readelf.txt'})
        (out/'verified-binary-hashes.json').write_text(json.dumps(rows,indent=2)+'\n')
        PYPROVIDER
    - name: Allow and record visible soft keyboard for isolated input stress
      shell: bash
      run: |
        adb shell settings get secure show_ime_with_hard_keyboard > runtime-artifacts/ime-with-hard-keyboard-before.txt
        adb shell settings put secure show_ime_with_hard_keyboard 1
        adb shell settings get secure show_ime_with_hard_keyboard > runtime-artifacts/ime-with-hard-keyboard-after.txt
        test "$(tr -d '\r\n' < runtime-artifacts/ime-with-hard-keyboard-after.txt)" = 1
        adb shell settings get secure default_input_method > runtime-artifacts/default-input-method-before-stress.txt
        adb shell dumpsys input_method > runtime-artifacts/input-method-before-stress.txt
        adb shell dumpsys window > runtime-artifacts/window-before-stress.txt
    - name: Run independent native WebView control once
      id: control16k
      continue-on-error: true
      run: |-
        set -euo pipefail
        timeout 960 adb shell am instrument -w -r -e useTestStorageService true -e expectedSdk ${{ matrix.api }} -e class com.shikuang.control16k.WebViewControl16kInstrumentedTest com.shikuang.control16k.test/androidx.test.runner.AndroidJUnitRunner > runtime-artifacts/com.shikuang.control16k-instrumentation.txt 2>&1
        cat runtime-artifacts/com.shikuang.control16k-instrumentation.txt
        python3 - <<'PYRESULT'
        from pathlib import Path
        text=Path('runtime-artifacts/com.shikuang.control16k-instrumentation.txt').read_text()
        assert 'OK (1 test)' in text and 'INSTRUMENTATION_CODE: -1' in text,text[-6000:]
        assert 'Process crashed' not in text and 'FAILURES!!!' not in text and 'INSTRUMENTATION_FAILED' not in text
        PYRESULT
    - name: Preserve control experiment before original app
      if: ${{ always() }}
      run: |
        mkdir -p runtime-artifacts/control16k
        timeout 30 adb logcat -b all -d -v threadtime > runtime-artifacts/control16k/logcat-after-control.txt || true
        timeout 20 adb shell dumpsys activity exit-info com.shikuang.control16k > runtime-artifacts/control16k/exit-info.txt || true
        timeout 20 adb exec-out screencap -p > runtime-artifacts/control16k/final-screen.png || true
        timeout 20 adb shell dumpsys input_method > runtime-artifacts/control16k/input-method.txt || true
        timeout 20 adb shell dumpsys window > runtime-artifacts/control16k/window.txt || true
        timeout 20 adb shell dumpsys webviewupdate > runtime-artifacts/control16k/webview-provider.txt || true
        timeout 20 adb shell pm path com.shikuang.control16k > runtime-artifacts/control16k/package-path.txt || true
    - name: Run unchanged product native input lifecycle once
      if: ${{ always() && steps.control16k.outcome != 'skipped' }}
      id: app16k
      continue-on-error: true
      run: |-
        set -euo pipefail
        timeout 960 adb shell am instrument -w -r -e useTestStorageService true -e expectedSdk ${{ matrix.api }} -e class com.shikuang.app.InputLifecycle16kStressInstrumentedTest com.shikuang.app.preview.test/androidx.test.runner.AndroidJUnitRunner > runtime-artifacts/com.shikuang.app.preview-instrumentation.txt 2>&1
        cat runtime-artifacts/com.shikuang.app.preview-instrumentation.txt
        python3 - <<'PYRESULT'
        from pathlib import Path
        text=Path('runtime-artifacts/com.shikuang.app.preview-instrumentation.txt').read_text()
        assert 'OK (1 test)' in text and 'INSTRUMENTATION_CODE: -1' in text,text[-6000:]
        assert 'Process crashed' not in text and 'FAILURES!!!' not in text and 'INSTRUMENTATION_FAILED' not in text
        PYRESULT
    - name: Capture runtime diagnostics
      if: always()
      shell: bash
      run: |
        mkdir -p runtime-artifacts
        ps -ef > runtime-artifacts/host-processes-final.txt
        free -m > runtime-artifacts/host-memory-final.txt
        timeout 15 adb reconnect offline > runtime-artifacts/adb-reconnect-final.txt 2>&1 || true
        timeout 20 adb wait-for-device >> runtime-artifacts/adb-reconnect-final.txt 2>&1 || true
        timeout 20 adb exec-out screencap -p > runtime-artifacts/final-screen.png || true
        timeout 20 adb shell dumpsys webviewupdate > runtime-artifacts/webview-provider-final.txt || true
        timeout 20 adb shell dumpsys ethernet > runtime-artifacts/ethernet-final.txt || true
        timeout 20 adb shell dumpsys connectivity > runtime-artifacts/connectivity-final.txt || true
        timeout 20 adb shell ip route show table all > runtime-artifacts/ipv4-all-route-tables-final.txt || true
        timeout 20 adb shell ip -6 route show table all > runtime-artifacts/ipv6-all-route-tables-final.txt || true
        # A live streaming adb log may disconnect when the test driver resets
        # its connection. Preserve final buffers and process exit reasons too.
        timeout 30 adb logcat -b all -d -v threadtime > runtime-artifacts/logcat-final.txt || true
        timeout 20 adb shell dumpsys activity exit-info com.shikuang.app.preview > runtime-artifacts/app-exit-info.txt 2>&1 || true
        timeout 20 adb shell ps -A > runtime-artifacts/processes-final.txt 2>&1 || true
        timeout 20 adb shell dmesg > runtime-artifacts/kernel-final.txt 2>&1 || true
        timeout 20 adb shell getprop ro.build.fingerprint > runtime-artifacts/device-build-fingerprint.txt 2>&1 || true
        timeout 20 adb shell settings get secure default_input_method > runtime-artifacts/default-input-method.txt 2>&1 || true
        timeout 20 adb shell dumpsys input_method > runtime-artifacts/input-method-final.txt 2>&1 || true
        timeout 20 adb shell dumpsys window > runtime-artifacts/window-final.txt 2>&1 || true
        timeout 20 adb shell settings get secure show_ime_with_hard_keyboard > runtime-artifacts/ime-with-hard-keyboard-final.txt 2>&1 || true
        timeout 20 adb shell pm list packages --apex-only --show-versioncode > runtime-artifacts/apex-versions.txt 2>&1 || true
        mkdir -p runtime-artifacts/tombstones
        timeout 30 adb pull /data/tombstones/. runtime-artifacts/tombstones/ > runtime-artifacts/tombstone-collection.txt 2>&1 || true
        mkdir -p runtime-artifacts/runtime-smoke
        timeout 60 adb pull /sdcard/googletest/test_outputfiles/. runtime-artifacts/runtime-smoke/ || true
        # The official AndroidX test storage provider owns this directory.
        # AGP's UTP collector copies genuine files before
        # later Gradle tasks finish. Preserve that export if post-test ADB drops.
        python3 - <<'PYOUTPUT'
        from pathlib import Path
        import hashlib, shutil
        sources = [Path('android/app/build/outputs/connected_android_test_additional_output'), Path('android16k-control/build/outputs/connected_android_test_additional_output')]
        target = Path('runtime-artifacts/runtime-smoke')
        for source in sources:
            for file in source.rglob('*') if source.exists() else []:
                if not file.is_file() or file.suffix not in ('.json', '.png', '.txt'):
                    continue
                target.mkdir(parents=True, exist_ok=True)
                output = target / file.name
                if output.exists():
                    assert output.read_bytes() == file.read_bytes(), f'Device and UTP evidence differ: {file.name}'
                else:
                    shutil.copy2(file, output)
        PYOUTPUT
    - name: Strict lifecycle gate and separate observed input visibility result
      if: ${{ always() }}
      env:
        SHIKUANG_CONTROL_OUTCOME: ${{ steps.control16k.outcome }}
        SHIKUANG_APP_OUTCOME: ${{ steps.app16k.outcome }}
        EXPECTED_SDK: ${{ matrix.api }}
      run: |
        python3 - <<'PYCOMPARE'
        import json, os
        from pathlib import Path
        folder=Path('runtime-artifacts/runtime-smoke')
        summary={'control_step':os.environ['SHIKUANG_CONTROL_OUTCOME'],'original_app_step':os.environ['SHIKUANG_APP_OUTCOME'],'protocols':{},'root_cause_fixed':False}
        for prefix, package in [('control16k-input-lifecycle','com.shikuang.control16k'),('input-lifecycle','com.shikuang.app.preview')]:
            filename=folder / (prefix+'-report.json')
            summary['protocols'][package]={'report_present':filename.exists()}
            if filename.exists():
                report=json.loads(filename.read_text())
                summary['protocols'][package].update(phase=report.get('phase'),completed_cycles=len(report.get('cycles',[])),native_cycles=sum(r.get('nativeComposingAndVisibleImeVerified',False) for r in report.get('cycles',[])))
        Path('runtime-artifacts/comparison-step-outcomes.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
        visibility={}
        for prefix in ['control16k-input-lifecycle','input-lifecycle']:
            visibility[prefix]={}
            for view in ['identify','library','records']:
                path=folder / f'{prefix}-{view}-composing.json'
                if path.exists():
                    d=json.loads(path.read_text());visibility[prefix][view]={'actual_draw_observed':d.get('visualFrameObserved',False),'input_fully_unobscured':d['dom'].get('inputFullyUnobscured',False),'ime_visible':d['imeVisible'],'bounds':d['dom'],'scope':'DOM value and actual PNG reviewed separately; visibility does not silently abort lifecycle observation'}
        Path('runtime-artifacts/observed-input-visibility.json').write_text(json.dumps(visibility,ensure_ascii=False,indent=2)+'\n')
        assert summary['control_step']=='success' and summary['original_app_step']=='success',summary
        for prefix, package in [('control16k-input-lifecycle','com.shikuang.control16k'),('input-lifecycle','com.shikuang.app.preview')]:
            report=json.loads((folder / (prefix+'-report.json')).read_text())
            assert report['phase']=='passed' and report['sdk']==int(os.environ['EXPECTED_SDK']) and report['pageSize']==16384 and report['deviceAbi']=='x86_64'
            assert report['packageName']==package and report['activeNetworkBefore'] is None and report['activeNetworkAfter'] is None
            assert len(report['cycles'])==12 and len({r['cycle'] for r in report['cycles']})==12
            assert sum(r['nativeComposingAndVisibleImeVerified'] for r in report['cycles'])==9
            for suffix in ['/native-touch-after','/ime-visible','/chinese-dom-verified']:
                assert sum(event['action'].endswith(suffix) for event in report['events'])==27
            assert all(r['backgroundForegroundVerified'] and r['recreateVerified'] and r['storedRecordPreserved'] and r['closedWithoutObservedCrash'] for r in report['cycles'])
            assert report['sentinelRemoved'] and not report['productionAccuracyClaim']
            for cycle in range(12):
                if cycle % 4 == 0: continue
                for phase in ['compose-before-background','compose-before-recreate','compose-before-close']:
                    connection=json.loads((folder / f'{prefix}-connection-result-{cycle}-{phase}.json').read_text())
                    assert connection['nativeCompositionReturned'] and 'failure' not in connection
                    assert connection['actualCallThreadId']==connection['handlerThreadId'] and connection['actualCallThreadName']==connection['handlerThreadName']
            for view,selector,cycle in [('identify','#notes',1),('library','#librarySearch',2),('records','#recordSearch',3)]:
                stem=f'{prefix}-{view}-composing'
                evidence=json.loads((folder / (stem+'.json')).read_text())
                assert evidence['visualFrameObserved']
                assert evidence['selector']==selector and evidence['imeVisible'] and evidence['windowFocus'] and evidence['nativeViewFocus']
                assert evidence['dom']['active'] and evidence['dom']['value']==f'quartz-实验室-{cycle}'
                assert (folder / (stem+'.png')).read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
                ime_stem=f'{prefix}-{view}-ime-visible'
                ime=json.loads((folder / (ime_stem+'.json')).read_text())
                assert ime['imeVisible'] and ime['windowFocus'] and ime['nativeViewFocus'] and ime['dom']['active']
                assert (folder / (ime_stem+'.png')).read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
        print('Both bounded protocols fully observed. Root cause remains open; no production fix or release claim.')
        PYCOMPARE
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: shikuang-official-image-comparison-${{ matrix.id }}
        path: runtime-artifacts/
        if-no-files-found: error
