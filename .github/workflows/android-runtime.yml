name: Android offline runtime smoke test
on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'android/**'
      - 'tools/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_AVD_HOME: /tmp/shikuang-avd
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - run: npm run sync
      - name: Install official Android emulator image
        shell: bash
        run: |
          SHIKUANG_ANDROID_SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SHIKUANG_ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "emulator" \
            "system-images;android-${{ matrix.api }};google_apis;x86_64"
          printf '%s\n' "$SHIKUANG_ANDROID_SDK/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$SHIKUANG_ANDROID_SDK/cmdline-tools/latest/bin/avdmanager" create avd \
            --name "shikuang-api${{ matrix.api }}" \
            --package "system-images;android-${{ matrix.api }};google_apis;x86_64" \
            --device pixel_2 --path "$ANDROID_AVD_HOME/shikuang-api${{ matrix.api }}.avd" --force
          test -f "$ANDROID_AVD_HOME/shikuang-api${{ matrix.api }}.ini"
          "$SHIKUANG_ANDROID_SDK/emulator/emulator" -list-avds
          sudo chmod 666 /dev/kvm
      - name: Boot emulator and disconnect device networking
        shell: bash
        run: |
          mkdir -p runtime-artifacts
          SHIKUANG_ANDROID_SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          nohup "$SHIKUANG_ANDROID_SDK/emulator/emulator" \
            -avd "shikuang-api${{ matrix.api }}" -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            -camera-back none -camera-front none -memory 3072 -cores 2 -accel on \
            > runtime-artifacts/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          timeout 180 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do sleep 2; done'
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell svc wifi disable
          adb shell svc data disable
          adb root
          timeout 60 adb wait-for-device
          test "$(adb shell id -u | tr -d '\r')" = 0
          adb shell 'for device in eth0 eth1 wlan0; do if ip link show "$device" >/dev/null 2>&1; then ip link set "$device" down; fi; done'
          test "$(timeout 20 adb get-state | tr -d '\r')" = device
          adb shell ip route show > runtime-artifacts/ipv4-routes.txt
          adb shell ip -6 route show > runtime-artifacts/ipv6-routes.txt
          adb shell dumpsys connectivity > runtime-artifacts/connectivity.txt
          adb shell dumpsys webviewupdate > runtime-artifacts/webview-provider.txt
          adb shell settings get global wifi_on > runtime-artifacts/wifi-state.txt
          adb shell settings get global mobile_data > runtime-artifacts/mobile-data-state.txt
          adb logcat -c
          nohup adb logcat -v threadtime > runtime-artifacts/logcat.txt 2>&1 &
      - name: Run packaged WebView with actual native ONNX inference
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true connectedDebugAndroidTest
      - name: Capture runtime diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p runtime-artifacts
          timeout 20 adb exec-out screencap -p > runtime-artifacts/final-screen.png || true
          timeout 20 adb shell dumpsys webviewupdate > runtime-artifacts/webview-provider-final.txt || true
          timeout 60 adb pull /sdcard/Android/data/com.shikuang.app.preview/files/runtime-smoke runtime-artifacts/ || true
      - name: Require screenshots and JSON from successful runtime tests
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder = Path('runtime-artifacts/runtime-smoke')
          for filename in ['quartz-result.png', 'dog-rejection.png', 'library-offline-overview.png', 'quartz-reference-details.png', 'quartz-image-references.png', 'abellaite-reference-details.png']:
              content = (folder / filename).read_bytes()
              assert content.startswith(b'\x89PNG\r\n\x1a\n') and len(content) > 1024, filename
          report = json.loads((folder / 'runtime-report.json').read_text())
          assert report['phase'] == 'passed', report.get('phase')
          assert report['quartz']['engine'] == 'onnx-native-android'
          assert report['catalog']['imaSpecies'] == 6239
          assert report['catalog']['crystalSpecies'] == 3430
          assert report['catalog']['imageReferences'] == 780
          assert report['catalog']['localFetches'] == 4
          assert report['catalog']['online'] is False
          print('Preserved native inference, offline catalog JSON and six genuine app screenshots.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shikuang-runtime-api-${{ matrix.api }}
          path: |
            runtime-artifacts/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
