// Diagnostic-only init script. No installation, instrumentation or release signing.
import groovy.json.JsonOutput
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('exportPretestInstallInputs') {
        dependsOn 'assembleDebug', 'assembleDebugAndroidTest'
        doLast {
            if (app.providers.gradleProperty('shikuangSoftwareDrawProbe').getOrElse('false') != 'false') {
                throw new GradleException('pretest uses unchanged accelerated debug configuration')
            }
            def declared = app.configurations.getByName('androidTestUtil').allDependencies.toList()
            if (declared.size() != 1 || declared[0].group != 'androidx.test.services' ||
                    declared[0].name != 'test-services' || declared[0].version != '1.4.2') {
                throw new GradleException('exact project test-services declaration required')
            }
            def dep = declared[0]
            def coordinate = "${dep.group}:${dep.name}:${dep.version}@apk"
            def resolved = app.configurations.detachedConfiguration(app.dependencies.create(coordinate))
            resolved.transitive = false
            def apk = resolved.singleFile
            def output = new File(app.providers.gradleProperty('shikuangPretestPlanOut').get())
            output.parentFile.mkdirs()
            if (!output.createNewFile()) throw new GradleException('fresh resolved input plan required')
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                schema: 'pretest-resolved-build-inputs-v1',
                utility_coordinate: coordinate, utility_path: apk.canonicalPath,
                app_metadata: app.layout.buildDirectory.file('outputs/apk/debug/output-metadata.json').get().asFile.canonicalPath,
                test_metadata: app.layout.buildDirectory.file('outputs/apk/androidTest/debug/output-metadata.json').get().asFile.canonicalPath,
                build_tasks: gradle.startParameter.taskNames,
                instrumentation_started: false
            ])) + '\n'
        }
    }
}
